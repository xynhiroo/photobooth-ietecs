<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg1)" />
  <circle cx="300" cy="180" r="160" fill="url(#glow1)" />
  <!-- Silhouette figure with smile -->
  <circle cx="300" cy="170" r="65" fill="#f8fafc" opacity="0.9" />
  <!-- Hair / Hat -->
  <path d="M 230 160 C 230 90, 370 90, 370 160 C 350 120, 250 120, 230 160 Z" fill="#3b0764" />
  <!-- Eyes & Smile -->
  <circle cx="280" cy="165" r="6" fill="#0f172a" />
  <circle cx="320" cy="165" r="6" fill="#0f172a" />
  <path d="M 285 190 Q 300 205 315 190" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Cheeks -->
  <circle cx="270" cy="180" r="8" fill="#ec4899" opacity="0.5" />
  <circle cx="330" cy="180" r="8" fill="#ec4899" opacity="0.5" />
  <!-- Body / Hoodie -->
  <path d="M 180 380 C 190 270, 230 250, 260 240 L 340 240 C 370 250, 410 270, 420 380 Z" fill="#6d28d9" />
  <path d="M 260 240 L 300 300 L 340 240" stroke="#d4a853" stroke-width="3" fill="none" />
  <!-- Pose Badge -->
  <rect x="20" y="20" width="130" height="32" rx="16" fill="rgba(15,23,42,0.7)" stroke="rgba(212,168,83,0.4)" />
  <text x="85" y="41" fill="#fef08a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pose 1: Smile ✨</text>
</svg>
